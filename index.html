<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup Fantasy Draft Decider</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @keyframes ballMorph {
      /* STATE 1: American Football (0% to 35%) */
      0%, 35% {
        transform: rotate(-15deg) scale(0.95);
        border-radius: 40% 70% 40% 70%;
        background: #7c2d12; /* Deep Pigskin Brown */
        box-shadow: 
          inset 2px 4px 0px rgba(255,255,255,0.15),
          inset -4px -4px 0px #451a03,
          0px 4px 10px rgba(0,0,0,0.4);
      }
      /* Laces Layer Overlay visibility during State 1 */
      0%, 35% {
        --laces-opacity: 1;
        --soccer-opacity: 0;
      }
      
      /* TRANSITION stage (35% to 65%) */
      35% { transform: rotate(-15deg); }
      50% { transform: rotate(180deg) scale(1.05); }
      65% { transform: rotate(375deg); }

      /* STATE 2: Classic Soccer Ball (65% to 100%) */
      65%, 100% {
        transform: rotate(360deg) scale(1);
        border-radius: 50%;
        background: #f8fafc; /* Crisp White Base */
        box-shadow: 
          inset 3px 3px 0px rgba(255,255,255,0.8),
          inset -3px -3px 0px #cbd5e1,
          0px 4px 12px rgba(0,0,0,0.5);
        --laces-opacity: 0;
        --soccer-opacity: 1;
      }
    }

    .anim-ball-canvas {
      animation: ballMorph 5s ease-in-out infinite alternate;
      position: relative;
      transition: all 0.4s ease-in-out;
    }

    /* Rendering dynamic pixel panels inside the vector frame safely */
    .laces-pixel { opacity: var(--laces-opacity, 1); transition: opacity 0.3s ease; }
    .soccer-pixel { opacity: var(--soccer-opacity, 0); transition: opacity 0.3s ease; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans p-3 md:p-8">

  <header class="max-w-5xl mx-auto border-b border-neutral-800 pb-4 mb-6 text-center md:text-left flex flex-col md:flex-row md:justify-between md:items-end gap-3">
    <div class="flex flex-col md:flex-row items-center md:items-end gap-4">
      
      <div class="w-12 h-12 bg-neutral-900 border border-neutral-800 rounded-xl flex items-center justify-center p-1 shrink-0 shadow-lg overflow-hidden">
        <div class="anim-ball-canvas w-9 h-9 flex items-center justify-center">
          
          <div class="laces-pixel absolute inset-0 flex items-center justify-center p-1">
            <div class="grid grid-cols-5 gap-[1px] w-4 h-5">
              <div class="bg-transparent"></div><div class="bg-white"></div><div class="bg-transparent"></div><div class="bg-white"></div><div class="bg-transparent"></div>
              <div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div>
              <div class="bg-transparent"></div><div class="bg-white"></div><div class="bg-transparent"></div><div class="bg-white"></div><div class="bg-transparent"></div>
            </div>
          </div>

          <div class="soccer-pixel absolute inset-0 grid grid-cols-5 gap-[1px] p-1">
            <div class="bg-transparent"></div><div class="bg-neutral-900"></div><div class="bg-transparent"></div><div class="bg-neutral-900"></div><div class="bg-transparent"></div>
            <div class="bg-neutral-900"></div><div class="bg-transparent"></div><div class="bg-neutral-900"></div><div class="bg-transparent"></div><div class="bg-neutral-900"></div>
            <div class="bg-transparent"></div><div class="bg-neutral-900"></div><div class="bg-transparent"></div><div class="bg-neutral-900"></div><div class="bg-transparent"></div>
          </div>

        </div>
      </div>

      <div class="text-center md:text-left">
        <h1 class="text-2xl md:text-3xl font-black uppercase tracking-wider text-amber-500 inline-block align-middle">World Cup Draft Decider</h1>
        <p class="text-neutral-400 text-[10px] md:text-xs font-bold tracking-widest uppercase mt-0.5 block">Last Year's Standings. This Year's Destiny.</p>
      </div>
    </div>

    <div id="sync-status" class="hidden text-neutral-500 font-mono text-[10px] md:text-[11px] bg-neutral-900 border border-neutral-800/80 rounded-full px-3 py-1.5 self-center md:self-auto shadow-inner">
      Synced: <span id="last-ago" class="text-neutral-300 font-bold">...</span> • 
      Next: <span id="next-countdown" class="text-amber-500 font-bold">...</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto">
    <div id="loading" class="text-center py-12 text-amber-500 font-bold text-xs uppercase tracking-widest animate-pulse">
      Connecting to Cloud Standings...
    </div>

    <div id="board-wrapper" class="hidden bg-neutral-900 border border-neutral-800 rounded-xl md:rounded-2xl overflow-hidden shadow-2xl">
      
      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-neutral-950 text-[11px] uppercase tracking-wider text-neutral-400 border-b border-neutral-800">
              <th class="py-4 px-6 text-center w-20">Pick</th>
              <th class="py-4 px-4">Manager</th>
              <th class="py-4 px-4">Country Allocation</th>
              <th class="py-4 px-4 text-center">Tournament Stage</th>
              <th class="py-4 px-4 text-center">Wins</th>
              <th class="py-4 px-4 text-center">GD</th>
              <th class="py-4 px-4 text-center">Odds</th>
            </tr>
          </thead>
          <tbody id="desktop-rows" class="divide-y divide-neutral-800/60">
            </tbody>
        </table>
      </div>

      <div id="mobile-list" class="block md:hidden divide-y divide-neutral-800/60 bg-neutral-900">
        </div>

    </div>
  </header>

  <script>
    // 1. INPUT YOUR COPIED PROJECT CREDENTIALS HERE
    const SUPABASE_URL = "https://grcdedmxdfdjgaextaru.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qAPRKnLO0JUSBG1iwYm0Pw_Ehfr9M8Z"; 

    // Safety check to alert you visually if the credential keys are broken
    if (SUPABASE_ANON_KEY.includes("YOUR_FULL") || SUPABASE_ANON_KEY.length < 40) {
      document.getElementById('loading').innerHTML = `<span class="text-rose-500 font-bold">⚠️ CRITICAL TYPO DETECTED:<br><span class="text-neutral-400 text-xs font-mono lowercase tracking-normal">The copied anon public key on line 98 is broken or missing. Update it in your index.html script to unlock the leaderboard!</span></span>`;
      document.getElementById('loading').classList.remove('animate-pulse');
    }

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const STAGES = {
      1: "Group",
      2: "R32",
      3: "R16",
      4: "Quarters",
      5: "Semis",
      6: "Runner Up",
      7: "Champion"
    };

    function calculateTimeDelta(lastUpdatedString) {
      const lastUpdate = new Date(lastUpdatedString);
      const now = new Date();
      const diffMins = Math.floor((now - lastUpdate) / 1000 / 60);
      const diffHours = Math.floor(diffMins / 60);

      let lastText = diffMins < 1 ? "just now" : diffMins < 60 ? `${diffMins}m ago` : `${diffHours}h ago`;
      
      const sixHoursMs = 6 * 60 * 60 * 1000;
      const timeRemainingMs = (lastUpdate.getTime() + sixHoursMs) - now.getTime();

      let nextText = "Imminent";
      if (timeRemainingMs > 0) {
        const remMinsTotal = Math.floor(timeRemainingMs / 1000 / 60);
        const remainingHours = Math.floor(remMinsTotal / 60);
        const remainingMins = remMinsTotal % 60;
        
        if (remainingHours > 0) {
          nextText = `in ~${remainingHours}h ${remainingMins}m`;
        } else {
          nextText = `in ~${remainingMins}m`;
        }
      }

      document.getElementById('last-ago').innerText = lastText;
      document.getElementById('next-countdown').innerText = nextText;
      document.getElementById('sync-status').classList.remove('hidden');
    }

    async function loadLeaderboard() {
      try {
        const { data, error } = await supabaseClient.from('world_cup_leaderboard').select('*');
        if (error) {
          document.getElementById('loading').innerText = "Database connection error details: " + error.message;
          return;
        }

        if (data.length > 0 && data[0].updated_at) calculateTimeDelta(data[0].updated_at);

        // Strict Tiebreaker Sorting: Stage -> Wins -> GD -> Lowest Odds First
        const sorted = data.sort((a, b) => {
          if (b.stage !== a.stage) return b.stage - a.stage;
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (b.gd !== a.gd) return b.gd - a.gd;
          return a.odds - b.odds;
        });

        const desktopBody = document.getElementById('desktop-rows');
        const mobileContainer = document.getElementById('mobile-list');
        desktopBody.innerHTML = '';
        mobileContainer.innerHTML = '';

        sorted.forEach((team, index) => {
          const pick = index + 1;
          const isEliminated = team.eliminated;
          
          let pickColor = 'text-amber-500';
          if (pick === 1) pickColor = 'text-emerald-400 font-black';
          if (pick === 12) pickColor = 'text-rose-500 font-black';

          // --- BUILD DESKTOP ROW ---
          const dRow = document.createElement('tr');
          dRow.className = `transition hover:bg-neutral-800/20 ${isEliminated ? 'opacity-30 bg-neutral-950/40' : ''}`;
          dRow.innerHTML = `
            <td class="py-4 px-6 text-center font-black text-base ${pickColor}">#${pick}</td>
            <td class="py-4 px-4 font-extrabold text-white tracking-wide text-sm">${team.manager}</td>
            <td class="py-4 px-4 text-neutral-200 text-sm">
              <span class="text-xl mr-2 inline-block align-middle">${team.flag}</span>
              <span class="align-middle uppercase tracking-wider text-xs font-bold">${team.country}</span>
            </td>
            <td class="py-4 px-4 text-center">
              <span class="text-[10px] px-2.5 py-1 rounded-full font-black uppercase bg-neutral-950 border border-neutral-800 ${isEliminated ? 'text-neutral-500' : 'text-amber-400 border-amber-500/20'}">
                ${STAGES[team.stage]} ${isEliminated ? '❌' : '🏁'}
              </span>
            </td>
            <td class="py-4 px-4 text-center font-mono font-bold text-sm">${team.wins}</td>
            <td class="py-4 px-4 text-center font-mono font-bold text-sm ${team.gd > 0 ? 'text-emerald-400' : team.gd < 0 ? 'text-rose-500' : 'text-neutral-400'}">${team.gd > 0 ? '+' + team.gd : team.gd}</td>
            <td class="py-4 px-4 text-center font-mono text-neutral-400 text-xs">${Number(team.odds).toFixed(2)}</td>
          `;
          desktopBody.appendChild(dRow);

          // --- BUILD MOBILE ROW ---
          const mCard = document.createElement('div');
          mCard.className = `p-4 flex items-center justify-between gap-2 ${isEliminated ? 'opacity-35 bg-neutral-950/30' : 'bg-neutral-900'}`;
          mCard.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <div class="text-base font-black w-9 h-9 rounded-lg bg-neutral-950 flex items-center justify-center border border-neutral-800 shadow-inner ${pickColor}">
                #${pick}
              </div>
              <div class="min-w-0">
                <p class="font-extrabold text-white tracking-wide text-sm truncate uppercase">${team.manager}</p>
                <p class="text-neutral-400 text-xs flex items-center gap-1.5 mt-0.5 font-medium">
                  <span>${team.flag}</span>
                  <span class="truncate tracking-wider text-[11px] font-bold uppercase">${team.country}</span>
                  <span class="text-[9px] px-1.5 py-0.2 bg-neutral-950 rounded font-black text-neutral-500">${STAGES[team.stage]}${isEliminated ? '❌' : ''}</span>
                </p>
              </div>
            </div>
            
            <div class="flex items-center gap-4 font-mono shrink-0">
              <div class="text-center">
                <span class="block text-[9px] font-sans font-bold text-neutral-500 uppercase tracking-widest">W</span>
                <span class="text-xs font-bold text-neutral-200">${team.wins}</span>
              </div>
              <div class="text-center border-l border-neutral-800 pl-3">
                <span class="block text-[9px] font-sans font-bold text-neutral-500 uppercase tracking-widest">GD</span>
                <span class="text-xs font-black ${team.gd > 0 ? 'text-emerald-400' : team.gd < 0 ? 'text-rose-500' : 'text-neutral-400'}">${team.gd > 0 ? '+' + team.gd : team.gd}</span>
              </div>
              <div class="text-center border-l border-neutral-800 pl-3">
                <span class="block text-[9px] font-sans font-bold text-neutral-500 uppercase tracking-widest">Odds</span>
                <span class="text-[11px] text-neutral-400 font-medium">${Number(team.odds).toFixed(1)}</span>
              </div>
            </div>
          `;
          mobileContainer.appendChild(mCard);
        });

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('board-wrapper').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerText = "An unexpected runtime error occurred.";
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>

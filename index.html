<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Draft Decider</title>
    
    <!-- Tailwind CSS CDN for global layout structure -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #ededed;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* --- THE LEGIBILITY FIX --- */
        /* Brightened row rule for knocked-out selections to ensure mobile legibility */
        .row-eliminated {
            opacity: 0.48 !important; 
            filter: grayscale(25%);
            transition: opacity 0.2s ease;
        }

        .badge-base {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        span[data-badge="countdown"] {
            display: inline-block;
            vertical-align: middle;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 6px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <main class="max-w-6xl mx-auto">
        <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-neutral-800 pb-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-amber-500">WORLD CUP DRAFT DECIDER</h1>
                <p class="text-xs text-neutral-400 mt-1 uppercase tracking-wider">Last Year's Standings. This Year's Destiny.</p>
            </div>
            <div class="text-xs text-neutral-500 mt-3 sm:mt-0 bg-neutral-900/50 px-3 py-1.5 rounded-md border border-neutral-800/60 self-start sm:self-center">
                Synced: <span id="sync-timestamp" class="text-neutral-300 font-medium">Loading...</span>
            </div>
        </header>

        <div class="overflow-x-auto bg-neutral-900/40 rounded-xl border border-neutral-800/80 shadow-2xl backdrop-blur-md">
            <table class="w-full text-left border-collapse min-w-[700px]">
                <thead>
                    <tr class="border-b border-neutral-800 text-neutral-400 text-xs uppercase tracking-wider bg-neutral-950/40">
                        <th class="py-4 px-4 text-center w-12">Pick</th>
                        <th class="py-4 px-4">Manager</th>
                        <th class="py-4 px-4">Country</th>
                        <th class="py-4 px-4 text-center">Stage</th>
                        <th class="py-4 px-4 text-center">W-D-L</th>
                        <th class="py-4 px-4 text-center">GD</th>
                        <th class="py-4 px-4 text-center">Odds</th>
                        <th class="py-4 px-4 max-w-[280px]">Next Up (AEST)</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-rows" class="divide-y divide-neutral-800/50 text-sm">
                    <!-- JavaScript dynamically populates rows here -->
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; 

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getStageBadge(stageWeight, isEliminated) {
            let label = 'GROUPS';
            let styles = 'bg-neutral-800 text-neutral-300 border border-neutral-700/50';

            switch(Number(stageWeight)) {
                case 3:
                    label = 'R32';
                    styles = 'bg-neutral-950 text-neutral-500 border border-neutral-900';
                    break;
                case 4:
                    label = 'R16';
                    styles = 'bg-neutral-950 text-neutral-400 border border-neutral-900';
                    break;
                case 5:
                    label = 'QUARTERS 🏁';
                    styles = isEliminated 
                        ? 'bg-neutral-900 text-neutral-400 border border-neutral-800' 
                        : 'bg-amber-950/40 text-amber-400 border border-amber-900/60';
                    break;
                case 6:
                    if (isEliminated) {
                        label = '3RD PLAYOFF 🏁';
                        styles = 'bg-orange-950/40 text-orange-400 border border-orange-900/60';
                    } else {
                        label = 'SEMIS 🏁';
                        styles = 'bg-purple-950/50 text-purple-300 border border-purple-800/60';
                    }
                    break;
                case 7:
                    label = '4TH PLACE 🏆';
                    styles = 'bg-stone-900 text-stone-400 border border-stone-800';
                    break;
                case 8:
                    label = '3RD PLACE 🏆';
                    styles = 'bg-amber-900/30 text-amber-600 border border-amber-900/40';
                    break;
                case 9:
                    label = '2ND PLACE 🥈';
                    styles = 'bg-slate-800/60 text-slate-300 border border-slate-700/50';
                    break;
                case 10:
                    label = 'CHAMPIONS 🏆';
                    styles = 'bg-yellow-500 text-neutral-950 border border-yellow-400 shadow-lg shadow-yellow-500/10 animate-pulse';
                    break;
                case 11:
                    label = 'FINALS 🏁';
                    styles = 'bg-rose-950/40 text-rose-400 border border-rose-900/60 font-black';
                    break;
                default:
                    if (isEliminated) {
                        label = 'ELIMINATED';
                        styles = 'bg-neutral-950 text-neutral-600 border border-neutral-900';
                    }
            }

            return `<span class="badge-base ${styles}">${label}</span>`;
        }

        async function renderLeaderboard() {
            const tableBody = document.getElementById('leaderboard-rows');
            
            let { data: teams, error } = await supabase
                .from('world_cup_leaderboard')
                .select('*');

            if (error) {
                console.error("Supabase Error:", error.message);
                return;
            }

            teams.sort((a, b) => {
                if (b.stage !== a.stage) return b.stage - a.stage;
                if (b.wins !== a.wins) return b.wins - a.wins;
                if (b.gd !== a.gd) return b.gd - a.gd;
                return a.odds - b.odds;
            });

            tableBody.innerHTML = '';

            if (teams.length > 0 && teams[0].updated_at) {
                document.getElementById('sync-timestamp').innerText = new Date(teams[0].updated_at).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', hour12: true });
            }

            teams.forEach((team, index) => {
                const isEliminated = team.eliminated === true;
                const stageNum = Number(team.stage);

                // --- THE VISUAL FIX ---
                // Only fade rows if the team is completely out of games (Stage 5 / Quarters or lower)
                const eliminationRowClass = (isEliminated && stageNum <= 5) ? 'row-eliminated' : '';
                const cleanGD = team.gd > 0 ? `+${team.gd}` : team.gd;

                const tableRowHtml = `
                    <tr class="${eliminationRowClass} hover:bg-neutral-800/20 transition-colors duration-150">
                        <td class="py-3.5 px-4 text-center font-bold text-xs text-neutral-500">#${index + 1}</td>
                        <td class="py-3.5 px-4 font-semibold tracking-wide text-neutral-200">${team.manager.toUpperCase()}</td>
                        <td class="py-3.5 px-4 text-neutral-300 font-medium">${team.country}</td>
                        <td class="py-3.5 px-4 text-center">${getStageBadge(team.stage, isEliminated)}</td>
                        <td class="py-3.5 px-4 text-center font-mono text-xs text-neutral-400">${team.wins}-${team.games_played}</td>
                        <td class="py-3.5 px-4 text-center font-bold font-mono text-xs ${team.gd > 0 ? 'text-emerald-500' : team.gd < 0 ? 'text-rose-500' : 'text-neutral-500'}">${cleanGD}</td>
                        <td class="py-3.5 px-4 text-center font-medium font-mono text-neutral-400">${Number(team.odds).toFixed(1)}</td>
                        <td class="py-3.5 px-4 text-xs font-medium text-amber-500/90 max-w-[280px] truncate">${team.next_match || 'TBD'}</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', tableRowHtml);
            });
        }

        document.addEventListener('DOMContentLoaded', renderLeaderboard());
    </script>
</body>
</html>

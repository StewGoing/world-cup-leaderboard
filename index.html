<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup Fantasy Draft Decider</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans p-4 md:p-8">

  <header class="max-w-5xl mx-auto border-b border-neutral-800 pb-5 mb-8 text-center md:text-left flex flex-col md:flex-row md:justify-between md:items-end gap-4">
    <div>
      <h1 class="text-3xl font-black uppercase tracking-wider text-amber-500">World Cup Draft Decider</h1>
      <p class="text-neutral-400 text-xs font-bold tracking-widest uppercase mt-1">Last Year's Standings. This Year's Destiny.</p>
    </div>
    <div id="sync-status" class="hidden text-neutral-500 font-mono text-[11px] bg-neutral-900 border border-neutral-800/80 rounded-full px-4 py-1.5 self-center md:self-auto shadow-inner text-center">
      Last synced: <span id="last-ago" class="text-neutral-300 font-bold">...</span> • 
      Next update: <span id="next-countdown" class="text-amber-500 font-bold">...</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto">
    <div id="loading" class="text-center py-12 text-amber-500 font-bold text-xs uppercase tracking-widest animate-pulse">
      Connecting to Cloud Standings...
    </div>

    <div id="board-wrapper" class="hidden bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-neutral-950 text-[11px] uppercase tracking-wider text-neutral-400 border-b border-neutral-800">
              <th class="py-4 px-6 text-center w-20">Pick</th>
              <th class="py-4 px-4">Manager</th>
              <th class="py-4 px-4">Country Allocation</th>
              <th class="py-4 px-4 text-center">Tournament Stage</th>
              <th class="py-4 px-4 text-center">Wins</th>
              <th class="py-4 px-4 text-center">GD</th>
              <th class="py-4 px-4 text-center">Odds</th>
            </tr>
          </thead>
          <tbody id="leaderboard-rows" class="divide-y divide-neutral-800/60">
            </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // 1. INPUT YOUR PUBLIC CREDENTIALS HERE
    const SUPABASE_URL = "https://grcdedmxdfdjgaextaru.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qAPRKnLO0JUSBG1iwYm0Pw_Ehfr9M8Z";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const STAGES = {
      1: "Group Stage",
      2: "Round of 32",
      3: "Round of 16",
      4: "Quarter-Finals",
      5: "Semi-Finals",
      6: "Runner Up / 3rd",
      7: "Champion"
    };

    // Computes the absolute text for relative time feeds
    function calculateTimeDelta(lastUpdatedString) {
      const lastUpdate = new Date(lastUpdatedString);
      const now = new Date();
      
      const diffMs = now - lastUpdate;
      const diffMins = Math.floor(diffMs / 1000 / 60);
      const diffHours = Math.floor(diffMins / 60);

      // 1. Format Last Updated Text
      let lastText = "";
      if (diffMins < 1) lastText = "just now";
      else if (diffMins < 60) lastText = `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
      else lastText = `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;

      // 2. Format Next Scheduled Sync Text (Based on our 12 hour cron schedule)
      const twelveHoursMs = 12 * 60 * 60 * 1000;
      const nextUpdateMs = lastUpdate.getTime() + twelveHoursMs;
      const timeRemainingMs = nextUpdateMs - now.getTime();

      let nextText = "";
      if (timeRemainingMs <= 0) {
        nextText = "Imminent";
      } else {
        const remainingMinsTotal = Math.floor(timeRemainingMs / 1000 / 60);
        const remainingHours = Math.floor(remainingMinsTotal / 60);
        const remainingMins = remainingMinsTotal % 60;
        
        if (remainingHours > 0) {
          nextText = `in ~${remainingHours}h ${remainingMins}m`;
        } else {
          nextText = `in ~${remainingMins}m`;
        }
      }

      document.getElementById('last-ago').innerText = lastText;
      document.getElementById('next-countdown').innerText = nextText;
      document.getElementById('sync-status').classList.remove('hidden');
    }

    async function loadLeaderboard() {
      try {
        const { data, error } = await supabaseClient.from('world_cup_leaderboard').select('*');
        
        if (error) {
          console.error(error);
          document.getElementById('loading').innerText = "Database connection error.";
          return;
        }

        // Use timestamps directly from rows to compute sync intervals
        if (data.length > 0 && data[0].updated_at) {
          calculateTimeDelta(data[0].updated_at);
        }

        // Strict custom tiebreaker sorting logic
        const sorted = data.sort((a, b) => {
          if (b.stage !== a.stage) return b.stage - a.stage;
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (b.gd !== a.gd) return b.gd - a.gd;
          return a.odds - b.odds;
        });

        const tbody = document.getElementById('leaderboard-rows');
        tbody.innerHTML = '';

        sorted.forEach((team, index) => {
          const pick = index + 1;
          const isEliminated = team.eliminated;
          
          const row = document.createElement('tr');
          row.className = `transition hover:bg-neutral-800/20 ${isEliminated ? 'opacity-30 bg-neutral-950/40' : ''}`;
          
          let pickColor = 'text-amber-500';
          if (pick === 1) pickColor = 'text-emerald-400 font-black';
          if (pick === 12) pickColor = 'text-rose-500 font-black';

          row.innerHTML = `
            <td class="py-4 px-6 text-center font-black text-base ${pickColor}">#${pick}</td>
            <td class="py-4 px-4 font-extrabold text-white tracking-wide text-sm">${team.manager}</td>
            <td class="py-4 px-4 text-neutral-200 text-sm">
              <span class="text-xl mr-2 inline-block align-middle">${team.flag}</span>
              <span class="align-middle uppercase tracking-wider text-xs font-bold">${team.country}</span>
            </td>
            <td class="py-4 px-4 text-center">
              <span class="text-[10px] px-2.5 py-1 rounded-full font-black uppercase bg-neutral-950 border border-neutral-800 ${isEliminated ? 'text-neutral-500 border-neutral-900/50' : 'text-amber-400 border-amber-500/20'}">
                ${STAGES[team.stage] || 'Group Stage'} ${isEliminated ? '❌' : '🏁'}
              </span>
            </td>
            <td class="py-4 px-4 text-center font-mono font-bold text-sm">${team.wins}</td>
            <td class="py-4 px-4 text-center font-mono font-bold text-sm ${team.gd > 0 ? 'text-emerald-400' : team.gd < 0 ? 'text-rose-500' : 'text-neutral-400'}">${team.gd > 0 ? '+' + team.gd : team.gd}</td>
            <td class="py-4 px-4 text-center font-mono text-neutral-400 text-xs">${Number(team.odds).toFixed(2)}</td>
          `;
          tbody.appendChild(row);
        });

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('board-wrapper').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerText = "An unexpected error occurred loading standings.";
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>

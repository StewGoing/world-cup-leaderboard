<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup Fantasy Draft Decider</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes marquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    .ticker-wrap {
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-content {
      display: inline-block;
      padding-left: 20%;
      animation: marquee 35s linear infinite;
    }
    .ticker-content:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans p-3 md:p-8">

  <div class="max-w-5xl mx-auto mb-4 bg-neutral-900/80 border border-neutral-800/60 rounded-lg overflow-hidden h-7 flex items-center shadow-lg">
    <div class="bg-amber-500 text-neutral-950 text-[9px] font-black uppercase tracking-widest px-3 h-full flex items-center z-10 shrink-0 select-none shadow-md">News</div>
    <div class="ticker-wrap w-full font-mono text-[11px] text-neutral-300 font-semibold relative">
      <div id="news-ticker" class="ticker-content">Loading live FIFA tournament feeds...</div>
    </div>
  </div>

  <header class="max-w-5xl mx-auto border-b border-neutral-800 pb-4 mb-6 flex flex-col md:flex-row md:justify-between items-center md:items-end gap-3 text-center md:text-left">
    <div>
      <h1 class="text-2xl md:text-3xl font-black uppercase tracking-wider text-amber-500 inline-block align-middle">World Cup Draft Decider</h1>
      <p class="text-neutral-400 text-[10px] md:text-xs font-bold tracking-widest uppercase mt-0.5 block">Last Year's Standings. This Year's Destiny.</p>
    </div>
    <div id="sync-status" class="hidden text-neutral-500 font-mono text-[10px] md:text-[11px] bg-neutral-900 border border-neutral-800/80 rounded-full px-3 py-1.5 self-center md:self-auto shadow-inner">
      Synced: <span id="last-ago" class="text-neutral-300 font-bold">...</span> • 
      Next: <span id="next-countdown" class="text-amber-500 font-bold">...</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto">
    <div id="loading" class="text-center py-12 text-amber-500 font-bold text-xs uppercase tracking-widest animate-pulse">
      Connecting to Cloud Standings...
    </div>

    <div id="board-wrapper" class="hidden space-y-6">
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl md:rounded-2xl overflow-hidden shadow-2xl">
        
        <div class="hidden md:block overflow-x-auto">
          <table class="w-full text-left border-collapse table-fixed max-w-5xl">
            <thead>
              <tr class="bg-neutral-950 text-[10px] uppercase font-black tracking-widest text-neutral-500 border-b border-neutral-800">
                <th class="py-4 px-4 text-center w-16">Pick</th>
                <th class="py-4 px-4 w-52">Manager</th>
                <th class="py-4 px-4 w-36">Country</th>
                <th class="py-4 px-4 text-center w-32">Stage</th>
                <th class="py-4 px-4 text-center w-20">W/D/L</th>
                <th class="py-4 px-4 text-center w-24">GD</th>
                <th class="py-4 px-4 text-center w-14">Odds</th>
                <th class="py-4 pl-4 pr-16 text-left
